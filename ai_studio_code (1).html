<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Game Parser</title>
    <style>
        :root {
            --bg-color: #0b1120;
            --panel-bg: #111827;
            --panel-bg-soft: #0f172a;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --border: #334155;
            --chip-bg: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b 0%, #0b1120 42%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            padding: 18px;
            border-bottom: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
        }

        header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p { color: var(--text-muted); font-size: 14px; margin-top: 6px; }

        .container {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            flex: 1;
            padding: 20px;
            gap: 18px;
            max-width: 1500px;
            margin: 0 auto;
            width: 100%;
        }

        .panel {
            display: flex;
            flex-direction: column;
            background: var(--panel-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            min-height: 75vh;
        }

        .panel.dragover {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.25);
        }

        .panel-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            background: rgba(15, 23, 42, 0.45);
        }

        .panel-header h2 { font-size: 16px; font-weight: 600; }

        .badge {
            background: var(--chip-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        textarea {
            flex: 1;
            width: 100%;
            padding: 16px;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
            font-size: 13px;
            line-height: 1.45;
            resize: none;
            outline: none;
        }

        .controls {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 10px;
            width: 170px;
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            padding: 11px 10px;
            font-size: 13px;
            font-weight: 700;
            color: white;
            transition: all 0.2s;
        }

        button svg { width: 16px; height: 16px; fill: currentColor; }

        .btn-parse { background: var(--primary); }
        .btn-parse:hover { background: var(--primary-hover); transform: translateY(-1px); }

        .btn-success { background: var(--success); }
        .btn-success:hover { background: var(--success-hover); transform: translateY(-1px); }

        .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
        .btn-danger:hover { background: var(--danger); color: white; }

        .output-tools {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: var(--panel-bg-soft);
        }

        .search-wrap { position: relative; }

        #searchInput {
            width: 100%;
            border: 1px solid var(--border);
            background: #020617;
            color: var(--text-main);
            border-radius: 8px;
            padding: 10px 12px;
            outline: none;
            font-size: 13px;
        }

        #searchInput:focus { border-color: var(--primary); }

        .suggestions {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            z-index: 4;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #020617;
            max-height: 220px;
            overflow-y: auto;
            display: none;
        }

        .suggestion-item {
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            gap: 8px;
            cursor: pointer;
            font-size: 13px;
        }

        .suggestion-item:hover { background: #1e293b; }

        .results-list {
            flex: 1;
            padding: 14px;
            overflow: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .game-card {
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            background: rgba(2, 6, 23, 0.45);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            background: #0f172a;
        }

        .game-title { font-weight: 700; font-size: 13px; }
        .game-actions { display: flex; gap: 8px; align-items: center; }

        .small-btn {
            border: 1px solid #475569;
            background: transparent;
            color: #cbd5e1;
            padding: 6px 8px;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .small-btn:hover { border-color: var(--primary); color: white; }

        .acc-list { list-style: none; }

        .acc-item {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            align-items: center;
            border-top: 1px dashed rgba(51, 65, 85, 0.6);
            padding: 8px 12px;
            font-family: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
            font-size: 12px;
        }

        .acc-item:first-child { border-top: none; }
        .acc-actions { display: flex; gap: 6px; }
        .icon-btn { padding: 4px 7px; font-size: 12px; }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--success);
            color: white;
            padding: 11px 16px;
            border-radius: 8px;
            transform: translateY(100px);
            opacity: 0;
            transition: 0.25s ease;
            font-weight: 700;
            z-index: 9;
        }

        .toast.show { transform: translateY(0); opacity: 1; }

        @media (max-width: 1100px) {
            .container { grid-template-columns: 1fr; }
            .controls { width: 100%; flex-direction: row; flex-wrap: wrap; }
            .controls button { flex: 1; min-width: 160px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Ultimate Game Parser</h1>
        <p>Эвристическая очистка и структурирование логов в формате Login:Pass прямо в браузере</p>
    </header>

    <div class="container">
        <section class="panel" id="dropZone">
            <div class="panel-header">
                <h2>Грязный лог</h2>
                <span class="badge">Drag & Drop .txt поддерживается</span>
            </div>
            <textarea id="inputText" placeholder="Вставьте сырые данные сюда или перетащите .txt файл..."></textarea>
        </section>

        <div class="controls">
            <button class="btn-parse" onclick="processText()"><svg viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>Анализировать</button>
            <button class="btn-success" onclick="downloadResult()"><svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>Скачать</button>
            <button class="btn-success" style="background:#0ea5e9" onclick="copyAllStructured()"><svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>Копировать</button>
            <button class="btn-danger" onclick="clearAll()"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>Очистить</button>
        </div>

        <section class="panel">
            <div class="panel-header">
                <h2>Результат</h2>
                <span class="badge" id="resultCount">Игр: 0 • Акков: 0</span>
            </div>
            <div class="output-tools">
                <div class="search-wrap">
                    <input id="searchInput" type="text" placeholder="Поиск игры...">
                    <div id="suggestions" class="suggestions"></div>
                </div>
            </div>
            <div id="resultsContainer" class="results-list"></div>
        </section>
    </div>

    <div id="toast" class="toast">Готово</div>

    <script>
        const gameStore = new Map();
        const DEFAULT_GAME = 'Unknown / Unlabeled';

        function isUrl(text) {
            return /^(https?:\/\/|www\.)/i.test(text);
        }

        function cleanLine(raw) {
            let line = raw.replace(/\r/g, '').trim();
            if (!line) return '';
            line = line.replace(/^\s*(\d+[\).]|[#*•💠💃⭐️♦️\-]{1,5})\s*/u, '');
            line = line.replace(/[💠💃⭐️♦️🎮🔑👤📌✔️✅❗️]/gu, '');
            return line.trim();
        }

        function isJunkLine(line) {
            return /^[-=*_~]{3,}$/.test(line) || /^\W{4,}$/.test(line);
        }

        function normalizeGameName(line) {
            return line.replace(/^\s*(игры?|games?|библиотека|аккаунт\s*№?)\s*[:\-]?\s*/i, '').trim() || DEFAULT_GAME;
        }

        function addAccount(game, login, pass) {
            if (!login || !pass) return;
            const pair = `${login}:${pass}`;
            if (!gameStore.has(game)) gameStore.set(game, new Set());
            gameStore.get(game).add(pair);
        }

        function parseRawPair(line) {
            const direct = line.match(/^([^\s:][^:]*)[:]([^\s].+)$/);
            if (!direct) return null;
            const login = direct[1].trim();
            const pass = direct[2].trim();
            if (!login || !pass) return null;
            if (isUrl(login) || isUrl(pass)) return null;
            return { login, pass };
        }

        function parseAccounts(text) {
            gameStore.clear();
            let currentGame = DEFAULT_GAME;
            let pendingLogin = '';

            const lines = text.replace(/\|/g, '\n').split('\n').map(cleanLine);

            const comboRegex = /^(.*?)(?:\blogin\b|\bлогин\b)\s*[:\-]?\s*([^\s|]+).*?(?:\bpass(?:word)?\b|\bпароль\b|\bпасс\b)\s*[:\-]?\s*(\S+)/i;
            const loginRegex = /(?:\blogin\b|\bлогин\b|\bemail\b|\baccount\b)\s*[:\-]?\s*(\S+)/i;
            const passRegex = /(?:\bpass(?:word)?\b|\bпароль\b|\bпасс\b)\s*[:\-]?\s*(\S+)/i;
            const explicitGameRegex = /^(игры?|games?|библиотека|аккаунт\s*№?)\s*[:\-]?\s*(.+)?$/i;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                if (!line || isJunkLine(line)) continue;

                const combo = line.match(comboRegex);
                if (combo) {
                    const prefix = (combo[1] || '').trim().replace(/[|,:;]+$/, '').trim();
                    if (prefix && !isUrl(prefix) && !/:\/\//.test(prefix)) {
                        currentGame = normalizeGameName(prefix);
                    }
                    addAccount(currentGame, combo[2], combo[3]);
                    pendingLogin = '';
                    continue;
                }

                const explicitGame = line.match(explicitGameRegex);
                if (explicitGame) {
                    currentGame = normalizeGameName(explicitGame[2] || explicitGame[0]);
                    pendingLogin = '';
                    continue;
                }

                const rawPair = parseRawPair(line);
                if (rawPair) {
                    addAccount(currentGame, rawPair.login, rawPair.pass);
                    pendingLogin = '';
                    continue;
                }

                const loginMatch = line.match(loginRegex);
                const passMatch = line.match(passRegex);

                if (loginMatch && passMatch) {
                    addAccount(currentGame, loginMatch[1], passMatch[1]);
                    pendingLogin = '';
                    continue;
                }

                if (loginMatch) {
                    pendingLogin = loginMatch[1];
                    continue;
                }

                if (passMatch) {
                    const pass = passMatch[1];
                    if (!pendingLogin) {
                        const prev = lines[i - 1] ? lines[i - 1].trim() : '';
                        if (prev && !isUrl(prev) && !prev.includes(':') && !explicitGameRegex.test(prev)) {
                            pendingLogin = prev;
                        }
                    }
                    if (pendingLogin) {
                        addAccount(currentGame, pendingLogin, pass);
                        pendingLogin = '';
                    }
                    continue;
                }

                if (!isUrl(line) && !line.includes(':') && line.length > 2) {
                    currentGame = normalizeGameName(line);
                    pendingLogin = '';
                }
            }
        }

        function getStructuredText(filteredGames = null) {
            const source = filteredGames || [...gameStore.keys()];
            let out = '';
            source.forEach(game => {
                const accounts = [...(gameStore.get(game) || [])];
                if (!accounts.length) return;
                out += `=== ${game} ===\n`;
                out += accounts.join('\n') + '\n\n';
            });
            return out.trim();
        }

        function renderResults(filter = '') {
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '';
            const search = filter.trim().toLowerCase();
            const games = [...gameStore.keys()].filter(g => g.toLowerCase().includes(search));

            games.forEach(game => {
                const accounts = [...gameStore.get(game)];
                const card = document.createElement('article');
                card.className = 'game-card';

                card.innerHTML = `
                    <div class="game-header">
                        <div class="game-title">${escapeHtml(game)}</div>
                        <div class="game-actions">
                            <span class="badge">${accounts.length}</span>
                            <button class="small-btn" data-copy-game="${encodeURIComponent(game)}">Copy All</button>
                        </div>
                    </div>
                    <ul class="acc-list"></ul>
                `;

                const list = card.querySelector('.acc-list');
                accounts.forEach(pair => {
                    const [login, ...rest] = pair.split(':');
                    const pass = rest.join(':');
                    const li = document.createElement('li');
                    li.className = 'acc-item';
                    li.innerHTML = `
                        <span>${escapeHtml(pair)}</span>
                        <div class="acc-actions">
                            <button class="small-btn icon-btn" data-copy="${encodeURIComponent(pair)}">📋</button>
                            <button class="small-btn icon-btn" data-copy="${encodeURIComponent(login)}">👤</button>
                            <button class="small-btn icon-btn" data-copy="${encodeURIComponent(pass)}">🔑</button>
                        </div>
                    `;
                    list.appendChild(li);
                });

                container.appendChild(card);
            });

            const totalAccounts = games.reduce((n, game) => n + gameStore.get(game).size, 0);
            document.getElementById('resultCount').innerText = `Игр: ${games.length} • Акков: ${totalAccounts}`;
        }

        function renderSuggestions(value = '') {
            const box = document.getElementById('suggestions');
            const q = value.trim().toLowerCase();
            if (!q) {
                box.style.display = 'none';
                box.innerHTML = '';
                return;
            }

            const items = [...gameStore.keys()]
                .filter(g => g.toLowerCase().includes(q))
                .slice(0, 10)
                .map(g => `<div class="suggestion-item" data-game="${encodeURIComponent(g)}"><span>${escapeHtml(g)}</span><span>${gameStore.get(g).size}</span></div>`)
                .join('');

            box.innerHTML = items || '<div class="suggestion-item"><span>Ничего не найдено</span></div>';
            box.style.display = 'block';
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"]+/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
        }

        function processText() {
            const input = document.getElementById('inputText').value;
            if (!input.trim()) {
                showToast('Вставьте текст для обработки', true);
                return;
            }
            const t0 = performance.now();
            parseAccounts(input);
            renderResults(document.getElementById('searchInput').value);
            const elapsed = (performance.now() - t0).toFixed(1);
            showToast(`Готово за ${elapsed}ms`);
        }

        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => showToast('Скопировано')); 
        }

        function copyAllStructured() {
            const txt = getStructuredText([...gameStore.keys()]);
            if (!txt) {
                showToast('Нет данных для копирования', true);
                return;
            }
            copyText(txt);
        }

        function downloadResult() {
            const out = getStructuredText([...gameStore.keys()]);
            if (!out) {
                showToast('Нет данных для скачивания', true);
                return;
            }
            const blob = new Blob([out], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Ultimate_Game_Parser_Result.txt';
            a.click();
            URL.revokeObjectURL(url);
            showToast('Файл скачан');
        }

        function clearAll() {
            document.getElementById('inputText').value = '';
            document.getElementById('searchInput').value = '';
            document.getElementById('suggestions').style.display = 'none';
            gameStore.clear();
            renderResults();
            showToast('Очищено');
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.backgroundColor = isError ? 'var(--danger)' : 'var(--success)';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2200);
        }

        document.getElementById('resultsContainer').addEventListener('click', e => {
            const copyVal = e.target.getAttribute('data-copy');
            if (copyVal) return copyText(decodeURIComponent(copyVal));

            const gameName = e.target.getAttribute('data-copy-game');
            if (gameName) {
                const game = decodeURIComponent(gameName);
                copyText([...(gameStore.get(game) || [])].join('\n'));
            }
        });

        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', e => {
            const val = e.target.value;
            renderResults(val);
            renderSuggestions(val);
        });

        document.getElementById('suggestions').addEventListener('click', e => {
            const item = e.target.closest('[data-game]');
            if (!item) return;
            const game = decodeURIComponent(item.getAttribute('data-game'));
            searchInput.value = game;
            renderResults(game);
            renderSuggestions(game);
        });

        document.addEventListener('click', e => {
            if (!e.target.closest('.search-wrap')) {
                document.getElementById('suggestions').style.display = 'none';
            }
        });

        const dropZone = document.getElementById('dropZone');
        const inputText = document.getElementById('inputText');

        dropZone.addEventListener('dragover', e => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (!file || !(file.type === 'text/plain' || file.name.endsWith('.txt'))) {
                showToast('Нужен .txt файл', true);
                return;
            }
            const reader = new FileReader();
            reader.onload = evt => {
                inputText.value = evt.target.result;
                processText();
            };
            reader.readAsText(file);
        });
    </script>
</body>
</html>
